[workspace]
resolver = "3"
members = ["crates/decoder", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/j-shelfwood/nasdara-bunker-morse"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.test]
opt-level = 3
