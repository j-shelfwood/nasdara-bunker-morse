[package]
name = "nasdara-bunker-morse"
description = "Reads the Nasdara bunker Morse broadcast in DayZ and shows each bunker's map grid and lock code"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "persistence", "accesskit"] }
egui = "0.37"
nasdara_decoder = { version = "0.3.1", path = "../decoder" }
open = "5.4.5"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
wasapi = "0.26.0"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1.34"
