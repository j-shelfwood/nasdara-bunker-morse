name: Bug report
description: Something did not decode, or the app misbehaved
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Audio source
      options:
        - DayZ
        - System audio
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Decoder log (optional)
      description: |
        Start the app with `--log decode.log --trace`, then attach both `decode.log` and `decode.log.trace.jsonl`
        (`--trace` writes the second file). The logs hold beep timings and digits, no audio.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: The release you downloaded, for example v0.1.0.
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Windows version
      description: For example Windows 11 23H2, from Settings > System > About.
    validations:
      required: true
