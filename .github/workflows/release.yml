name: release

# Push a tag such as v0.1.0. The exe is built here, from the tagged source, and attached to a GitHub release
# together with its SHA-256, the third-party licence notices and a build provenance attestation.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows
      - name: Tag matches the package version
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($meta.packages | Where-Object { $_.name -eq 'nasdara-bunker-morse' }).version
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($tag -ne $version) {
            Write-Error "Tag $tag differs from the package version $version"
            exit 1
          }
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p nasdara-bunker-morse
      - name: Name the artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = "bunker-morse-${{ github.ref_name }}-windows-x64.exe"
          Copy-Item target\release\nasdara-bunker-morse.exe "dist\$name"
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  licenses:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - run: cargo about generate --locked --fail --config about.toml --target x86_64-pc-windows-msvc --workspace about.hbs -o THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licenses
          path: THIRD-PARTY-LICENSES.html
          if-no-files-found: error

  publish:
    needs: [build, licenses]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: licenses
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/bunker-morse-*.exe
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/bunker-morse-*.exe
            dist/SHA256SUMS.txt
            dist/THIRD-PARTY-LICENSES.html
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
